<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 向内的蓝色边框 */
  .frame {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 25px 6px rgba(30, 144, 255, 0.75),
                inset 0 0 6px 2px rgba(80, 180, 255, 0.9);
  }

  .page {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    padding: 2.5vh 3vw 3vh;
  }

  /* 顶部四个按钮 */
  .nav {
    display: flex; gap: 2vw; justify-content: space-between;
    flex: 0 0 auto;
  }
  .nav a {
    flex: 1; text-align: center; text-decoration: none;
    color: #fff; font-size: clamp(13px, 1.8vw, 20px);
    padding: 10px 4px; border-radius: 10px; white-space: nowrap;
    background: linear-gradient(135deg, #1e90ff, #0a5fd8);
    box-shadow: 0 2px 10px rgba(30, 144, 255, 0.5);
  }
  .nav a:hover { filter: brightness(1.15); }

  /* 12 个格子：电脑 4 列 x 3 行 */
  .grid {
    flex: 1; min-height: 0;
    margin-top: 4vh;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 1.2vw;
  }
  .item {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    text-decoration: none; color: #222;
  }
  .item img {
    flex: 1; min-height: 0; width: 100%;
    object-fit: cover; display: block;
    border-radius: 8px; border: 2px solid #ddd;
  }
  /* 图片下方的标题 */
  .item .cap {
    flex: 0 0 auto;
    margin-top: 4px; text-align: center;
    font-size: clamp(12px, 1.4vw, 16px);
    line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 手机：2 列 x 6 行，左边 tp1-tp6，右边 tp7-tp12 */
  @media (max-width: 768px) {
    .grid {
      margin-top: 2vh;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(6, 1fr);
      grid-auto-flow: column;
      gap: 1vw 1.5vw;
    }
    .item img { border-width: 1px; border-radius: 5px; }
    .item .cap { font-size: 12px; margin-top: 2px; }
  }
</style>
</head>
<body>

  <div class="frame"></div>

  <div class="page">
    <div class="nav" id="nav"></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
  // 所有按钮和图片跳转的网址，想好以后只改这一行
  var SITE = "file:///C:/Users/Admin/Desktop/%E7%BD%91%E9%A1%B5/%E6%96%B0%E5%BB%BA%E6%96%87%E4%BB%B6%E5%A4%B9/dy.html";

  // 顶部四个按钮
  var names = ["首页", "精选", "TK", "QQ登录和注册"];
  var nav = document.getElementById("nav");
  names.forEach(function (n) {
    var a = document.createElement("a");
    a.href = SITE;
    a.textContent = n;
    nav.appendChild(a);
  });

  // 12 个标题：先默认写图片名字 tp1~tp12，
  // 以后你想改成自己的标题，直接改下面这个数组即可
  var titles = [
    "tp1", "tp2", "tp3", "tp4", "tp5", "tp6",
    "tp7", "tp8", "tp9", "tp10", "tp11", "tp12"
  ];

  // 12 张图片 tp1.jpg ~ tp12.jpg
  var grid = document.getElementById("grid");
  for (var i = 1; i <= 12; i++) {
    var a = document.createElement("a");
    a.className = "item";
    a.href = SITE;

    var img = document.createElement("img");
    img.src = "tp" + i + ".jpg";
    img.alt = "tp" + i;

    var cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = titles[i - 1];

    a.appendChild(img);
    a.appendChild(cap);
    grid.appendChild(a);
  }
</script>
</body>
</html>
