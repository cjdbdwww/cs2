<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>进入网页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* 两个视频都铺满整个屏幕，叠在一起，轮流显示 */
  .bg video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; opacity: 0;
  }
  .bg video.active { opacity: 1; z-index: 1; }

  /* 向内的蓝色边框 */
  .frame {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 25px 6px rgba(30, 144, 255, 0.75),
                inset 0 0 6px 2px rgba(80, 180, 255, 0.9);
  }

  .page {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding: 4vh 4vw;
  }

  .login {
    position: absolute; top: 2.5vh; right: 4vw;
    color: #fff; text-decoration: none; font-size: 16px;
    padding: 6px 12px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.35);
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .login:hover { background: rgba(30, 144, 255, 0.6); }

  .title {
    margin-top: 6vh;
    color: #fff; font-size: clamp(20px, 4vw, 40px); font-weight: bold;
    text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,.9);
  }

  /* 按钮比之前更靠下：margin-top 从 12vh 改成 20vh */
  .enter-btn {
    margin-top: 20vh;
    width: clamp(150px, 20vw, 220px); height: clamp(44px, 6vh, 56px);
    border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #1e90ff, #0a5fd8);
    color: #fff; font-size: 18px; letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(30, 144, 255, 0.7);
    transition: transform .2s, box-shadow .2s;
  }
  .enter-btn:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(30, 144, 255, 0.95); }

  /* 五张图片：中间偏下 */
  .gallery {
    position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%);
    width: 92vw; max-width: 1100px;
    display: flex; justify-content: center; gap: 1.5vw;
  }
  .gallery img {
    flex: 1; min-width: 0; width: 100%;
    aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: 8px; border: 2px solid rgba(255,255,255,.7);
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  @media (max-width: 768px) {
    .gallery { gap: 1vw; }
    .gallery img { border-width: 1px; border-radius: 5px; }
  }
</style>
</head>
<body>

  <div class="bg">
    <video id="v1" class="active" src="sp1.mp4" autoplay muted playsinline preload="auto"></video>
    <video id="v2" src="sp2.mp4" muted playsinline preload="auto"></video>
  </div>

  <div class="frame"></div>

  <div class="page">
    <a class="login" href="file:///C:/Users/Admin/Desktop/%E7%BD%91%E9%A1%B5/%E6%96%B0%E5%BB%BA%E6%96%87%E4%BB%B6%E5%A4%B9/dy.html" target="_blank">登录</a >
    <div class="title">这里想要的涩涩tk资源都有！</div>
    <button class="enter-btn" onclick="enterSite()">进入网页</button>
    <div class="gallery" id="gallery"></div>
  </div>

<script>
  // 点击“进入网页”后跳转的地址（自己修改）
  function enterSite() {
    window.location.href = "file:///C:/Users/Admin/Desktop/%E7%BD%91%E9%A1%B5/%E6%96%B0%E5%BB%BA%E6%96%87%E4%BB%B6%E5%A4%B9/1.html";
  }

  // 用脚本生成五张图片
  var gallery = document.getElementById("gallery");
  for (var i = 1; i <= 5; i++) {
    var img = document.createElement("img");
    img.src = "t" + i + ".jpg";
    img.alt = "t" + i;
    gallery.appendChild(img);
  }

  // sp1 播完立刻播 sp2，sp2 播完立刻回到 sp1，无缝循环
  var v1 = document.getElementById("v1");
  var v2 = document.getElementById("v2");
  var current = v1, next = v2, switching = false;

  function swap() {
    if (switching) return;
    switching = true;
    var old = current;
    next.currentTime = 0;
    var p = next.play();
    var done = function () {
      next.classList.add("active");
      old.classList.remove("active");
      setTimeout(function () {
        old.pause();
        old.currentTime = 0;
      }, 150);
      current = next;
      next = old;
      switching = false;
    };
    if (p && p.then) { p.then(done).catch(done); } else { done(); }
  }

  function check() {
    if (current.duration && current.currentTime >= current.duration - 0.1) {
      swap();
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);

  // 兜底：万一没触发，视频结束时也切换
  v1.addEventListener("ended", swap);
  v2.addEventListener("ended", swap);

  // 部分手机需要一次触摸才允许自动播放
  document.addEventListener("touchstart", function () {
    current.play();
  }, { once: true });
</script>
</body>
</html>
